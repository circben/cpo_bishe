<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPO 性能对比分析</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --bg: #ffffff;
            --surface: #e2e8f0;
            --border: #cbd5e1;
            --text: #1e293b;
            --text-secondary: #64748b;
        }
        
        body {
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        .header {
            background: var(--bg);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 { font-size: 18px; font-weight: 600; }
        
        .header-right { display: flex; align-items: center; gap: 12px; }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--surface);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
        .status-dot.connected { background: var(--success); }
        .status-dot.error { background: var(--danger); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        
        .controls-bar {
            background: var(--surface);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid var(--border);
        }
        
        .control-group { display: flex; align-items: center; gap: 8px; }
        .control-group label { color: var(--text-secondary); font-size: 13px; }
        
        select, input {
            padding: 8px 10px;
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            font-size: 13px;
        }
        
        select:hover, input:hover { border-color: var(--primary); }
        select:focus, input:focus { outline: none; border-color: var(--primary); }
        
        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        button:hover { border-color: var(--primary); color: var(--primary); }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-card .icon { font-size: 28px; margin-bottom: 8px; }
        .stat-card .number { font-size: 26px; font-weight: 700; color: var(--primary); }
        .stat-card .label { color: var(--text-secondary); margin-top: 4px; font-size: 12px; }
        
        .run-section {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .section-header h2 { font-size: 16px; color: var(--text); }
        
        .section-badge {
            background: var(--primary);
            color: #fff;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .run-select-wrapper { margin-bottom: 16px; }
        .run-select-wrapper select { width: 100%; padding: 10px 12px; font-size: 13px; }
        
        .run-detail {
            background: var(--surface);
            border-radius: 10px;
            padding: 16px;
            border: 1px solid var(--border);
        }
        
        .run-detail-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .run-detail-item { background: var(--bg); padding: 12px; border-radius: 8px; }
        .run-detail-label { color: var(--text-secondary); font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
        .run-detail-value { font-size: 13px; font-weight: 500; color: var(--primary); }
        .run-detail-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        
        .method-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }
        
        .method-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
        }
        
        .method-card:hover { border-color: var(--primary); }
        
        .method-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .method-card-name { font-weight: 600; color: var(--text); font-size: 14px; }
        .method-card-accuracy { font-size: 20px; font-weight: 700; }
        .method-card-accuracy.high { color: var(--success); }
        .method-card-accuracy.med { color: var(--warning); }
        .method-card-accuracy.low { color: var(--danger); }
        
        .method-card-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: var(--text-secondary); }
        .method-stat-label { font-size: 10px; text-transform: uppercase; }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .chart-panel {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        
        .chart-panel h3 { font-size: 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        .bar-row {
            display: grid;
            grid-template-columns: 90px 1fr 60px;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            margin-bottom: 8px;
        }
        
        .bar-track {
            height: 10px;
            background: var(--surface);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            border-radius: 5px;
            background: var(--primary);
            transition: width 0.5s ease;
        }
        
        .bar-fill.highlight { background: var(--warning); }
        .bar-label { color: var(--text-secondary); }
        .bar-value { color: var(--text); text-align: right; }
        
        .table-panel {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .table-panel h3 { font-size: 14px; margin-bottom: 16px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border-bottom: 1px solid var(--border); text-align: left; padding: 10px 8px; }
        th { color: var(--text-secondary); font-weight: 600; font-size: 11px; text-transform: uppercase; }
        tr:hover { background: var(--surface); }
        td.mono { font-family: monospace; color: var(--primary); }
        
        .status-text {
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 16px;
            padding: 10px 12px;
            background: var(--surface);
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .run-list {
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        
        .run-list-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        
        .run-list-item:last-child { border-bottom: none; }
        .run-list-item:hover { background: var(--surface); }
        .run-list-item.selected { background: #eff6ff; border-left: 3px solid var(--primary); }
        .run-list-item-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; color: var(--primary); }
        .run-list-item-meta { font-size: 11px; color: var(--text-secondary); display: flex; gap: 12px; }
        .run-list-empty { padding: 24px; text-align: center; color: var(--text-secondary); }
        
        .empty-state { padding: 32px; text-align: center; color: var(--text-secondary); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        
        @media (max-width: 1000px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .run-detail-grid { grid-template-columns: repeat(2, 1fr); }
        }
        
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr; }
            .controls-bar { flex-direction: column; align-items: stretch; }
            .method-cards { grid-template-columns: 1fr; }
            .run-detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <nav class="header">
        <h1>📊 性能对比分析</h1>
        <div class="header-right">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">加载中...</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Controls -->
        <div class="controls-bar">
            <div class="control-group">
                <label>数据集</label>
                <select id="datasetSelect">
                    <option value="all">all</option>
                    <option value="gsm8k">gsm8k</option>
                    <option value="strategyqa">strategyqa</option>
                </select>
            </div>
            <div class="control-group">
                <label>最多读取</label>
                <input id="limitInput" type="number" value="50" min="1" max="500" style="width: 80px;" />
            </div>
            <button id="refreshBtn">🔄 刷新数据</button>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">📁</div>
                <div class="number" id="runCount">0</div>
                <div class="label">Run 数量</div>
            </div>
            <div class="stat-card">
                <div class="icon">⚡</div>
                <div class="number" id="methodCount">0</div>
                <div class="label">方法数量</div>
            </div>
            <div class="stat-card">
                <div class="icon">🎯</div>
                <div class="number" id="bestAcc">0%</div>
                <div class="label">最佳准确率</div>
            </div>
            <div class="stat-card">
                <div class="icon">⚡</div>
                <div class="number" id="bestLatency">0s</div>
                <div class="label">最低延迟</div>
            </div>
        </div>

        <!-- Run Selector Section -->
        <div class="run-section">
            <div class="section-header">
                <h2>🔍 选择 Run 查看详情</h2>
                <span class="section-badge" id="runBadge">0 Runs</span>
            </div>
            <div class="run-select-wrapper">
                <select id="runSelect">
                    <option value="">-- 请选择一次 Run --</option>
                </select>
            </div>
            <div class="run-detail" id="runDetail" style="display: none;">
                <div class="run-detail-title" id="detailTitle">Run 详情</div>
                <div class="run-detail-grid">
                    <div class="run-detail-item">
                        <div class="run-detail-label">Run 名称</div>
                        <div class="run-detail-value" id="detailRunName">-</div>
                    </div>
                    <div class="run-detail-item">
                        <div class="run-detail-label">数据集</div>
                        <div class="run-detail-value" id="detailTask">-</div>
                    </div>
                    <div class="run-detail-item">
                        <div class="run-detail-label">Split</div>
                        <div class="run-detail-value" id="detailSplit">-</div>
                    </div>
                    <div class="run-detail-item">
                        <div class="run-detail-label">创建时间</div>
                        <div class="run-detail-value" id="detailCreatedAt">-</div>
                    </div>
                </div>
                <h4 style="margin: 15px 0 10px; font-size: 14px; color: #888;">方法明细</h4>
                <div id="methodCards" class="method-cards"></div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-panel">
                <h3>📈 方法平均准确率（%）</h3>
                <div id="accBars"></div>
            </div>
            <div class="chart-panel">
                <h3>⏱️ 方法平均延迟（秒）</h3>
                <div id="latBars"></div>
            </div>
        </div>

        <!-- Method Table -->
        <div class="table-panel">
            <h3>📋 方法聚合表（所有 Runs 汇总）</h3>
            <table>
                <thead>
                    <tr>
                        <th>方法</th>
                        <th>Runs</th>
                        <th>平均准确率</th>
                        <th>最佳准确率</th>
                        <th>平均延迟</th>
                    </tr>
                </thead>
                <tbody id="methodTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const datasetSelect = document.getElementById('datasetSelect');
        const limitInput = document.getElementById('limitInput');
        const runSelect = document.getElementById('runSelect');

        const runCount = document.getElementById('runCount');
        const methodCount = document.getElementById('methodCount');
        const bestAcc = document.getElementById('bestAcc');
        const bestLatency = document.getElementById('bestLatency');
        const runBadge = document.getElementById('runBadge');

        const methodTableBody = document.getElementById('methodTableBody');
        const runDetail = document.getElementById('runDetail');

        let allRuns = [];

        const API_CANDIDATES = [
            'http://127.0.0.1:8888',
            'http://127.0.0.1:8899',
            window.location.origin
        ];

        let apiBase = '';

        function updateStatus(connected, text) {
            statusDot.className = 'status-dot' + (connected ? ' connected' : ' error');
            statusText.textContent = text;
        }

        function fmtPct(v) {
            return `${(Number(v || 0) * 100).toFixed(2)}%`;
        }

        function fmtSec(v) {
            return `${Number(v || 0).toFixed(2)}s`;
        }

        function renderBars(containerId, rows, key, maxValue, isLatency) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (!rows.length) {
                container.innerHTML = '<div class="empty-state">暂无数据</div>';
                return;
            }
            rows.forEach((row) => {
                const value = Number(row[key] || 0);
                const pct = maxValue > 0 ? (value / maxValue) * 100 : 0;
                const display = key.includes('accuracy') ? fmtPct(value) : fmtSec(value);
                container.insertAdjacentHTML('beforeend', `
                    <div class="bar-row">
                        <div class="bar-label">${row.method}</div>
                        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
                        <div class="bar-value">${display}</div>
                    </div>
                `);
            });
        }

        function renderMethodTable(rows) {
            methodTableBody.innerHTML = '';
            if (!rows.length) {
                methodTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#666;">暂无数据</td></tr>';
                return;
            }
            rows.forEach((row) => {
                methodTableBody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td class="mono">${row.method}</td>
                        <td>${row.runs}</td>
                        <td>${fmtPct(row.avg_accuracy)}</td>
                        <td>${fmtPct(row.best_accuracy)}</td>
                        <td>${fmtSec(row.avg_latency_sec)}</td>
                    </tr>
                `);
            });
        }

        function renderRunSelect(runs) {
            allRuns = runs;
            runSelect.innerHTML = '<option value="">-- 请选择一次 Run --</option>';
            runs.forEach((run, idx) => {
                const label = `${run.task || 'unknown'} / ${run.run_name || 'run' + idx} / ${run.created_at || '-'}`;
                runSelect.innerHTML += `<option value="${idx}">${label}</option>`;
            });
            runBadge.textContent = `${runs.length} Runs`;
        }

        function showRunDetail(idx) {
            if (idx === '' || idx === null || idx === undefined) {
                runDetail.style.display = 'none';
                return;
            }
            const run = allRuns[idx];
            if (!run) return;

            document.getElementById('detailRunName').textContent = run.run_name || '-';
            document.getElementById('detailTask').textContent = run.task || '-';
            document.getElementById('detailSplit').textContent = run.split || '-';
            document.getElementById('detailCreatedAt').textContent = run.created_at || '-';

            const methodCards = document.getElementById('methodCards');
            const methods = run.methods || [];
            if (!methods.length) {
                methodCards.innerHTML = '<div class="empty-state">该 Run 无方法数据</div>';
            } else {
                methodCards.innerHTML = methods.map(m => {
                    const acc = Number(m.accuracy || 0) * 100;
                    const accClass = acc >= 80 ? 'high' : acc >= 60 ? 'med' : 'low';
                    return `
                        <div class="method-card">
                            <div class="method-card-header">
                                <span class="method-card-name">${m.method}</span>
                                <span class="method-card-accuracy ${accClass}">${fmtPct(m.accuracy)}</span>
                            </div>
                            <div class="method-card-stats">
                                <div class="method-stat-item">
                                    <span class="method-stat-label">样本数</span>
                                    <span class="method-stat-value">${m.count || 0}</span>
                                </div>
                                <div class="method-stat-item">
                                    <span class="method-stat-label">平均延迟</span>
                                    <span class="method-stat-value">${fmtSec(m.avg_latency_sec)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            runDetail.style.display = 'block';
        }

        async function findApiBase() {
            for (const base of API_CANDIDATES) {
                try {
                    const resp = await fetch(`${base}/api/datasets`, { cache: 'no-store' });
                    if (resp.ok) return base;
                } catch (e) { /* continue */ }
            }
            return '';
        }

        async function loadPerformance() {
            const dataset = datasetSelect.value;
            const limit = Math.max(1, Math.min(500, Number(limitInput.value || 50)));

            updateStatus(false, '正在读取 runs 目录并聚合...');

            if (!apiBase) {
                apiBase = await findApiBase();
            }

            if (!apiBase) {
                updateStatus(false, '请先启动 run_stage5_api_server.py');
                return;
            }

            try {
                const resp = await fetch(`${apiBase}/api/performance/runs?dataset=${encodeURIComponent(dataset)}&limit=${limit}`);
                const data = await resp.json();
                if (data.error) {
                    updateStatus(false, `读取失败: ${data.error}`);
                    return;
                }

                const methods = Array.isArray(data.method_summary) ? data.method_summary : [];
                const runs = Array.isArray(data.runs) ? data.runs : [];

                if (Array.isArray(data.datasets) && data.datasets.length > 0) {
                    const current = datasetSelect.value;
                    const options = ['all', ...data.datasets];
                    datasetSelect.innerHTML = options
                        .map((d) => `<option value="${d}">${d}</option>`)
                        .join('');
                    datasetSelect.value = options.includes(current) ? current : 'all';
                }

                runCount.textContent = String(data.run_count || runs.length || 0);
                methodCount.textContent = String(methods.length);

                const bestAccMethod = methods.reduce((best, row) => {
                    return (!best || Number(row.best_accuracy) > Number(best.best_accuracy)) ? row : best;
                }, null);
                const bestLatencyMethod = methods.reduce((best, row) => {
                    return (!best || Number(row.avg_latency_sec) < Number(best.avg_latency_sec)) ? row : best;
                }, null);

                bestAcc.textContent = bestAccMethod ? `${fmtPct(bestAccMethod.best_accuracy)}` : '0%';
                bestLatency.textContent = bestLatencyMethod ? `${fmtSec(bestLatencyMethod.avg_latency_sec)}` : '0s';

                const sortedByAcc = [...methods].sort((a, b) => Number(b.avg_accuracy) - Number(a.avg_accuracy));
                const sortedByLat = [...methods].sort((a, b) => Number(a.avg_latency_sec) - Number(b.avg_latency_sec));
                const maxAcc = sortedByAcc.length ? Math.max(...sortedByAcc.map((m) => Number(m.avg_accuracy || 0))) : 0;
                const maxLat = sortedByLat.length ? Math.max(...sortedByLat.map((m) => Number(m.avg_latency_sec || 0))) : 0;

                renderBars('accBars', sortedByAcc, 'avg_accuracy', maxAcc, false);
                renderBars('latBars', sortedByLat, 'avg_latency_sec', maxLat, true);
                renderMethodTable(sortedByAcc);
                renderRunSelect(runs);

                runSelect.value = '';
                runDetail.style.display = 'none';

                updateStatus(true, `已读取 ${data.root || 'runs'}，dataset=${data.dataset || 'all'}，run_count=${data.run_count || 0}`);
            } catch (err) {
                updateStatus(false, `读取失败: ${err.message || err}`);
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', loadPerformance);
        datasetSelect.addEventListener('change', loadPerformance);
        runSelect.addEventListener('change', (e) => {
            showRunDetail(e.target.value);
        });

        // Initialize
        (async function init() {
            apiBase = await findApiBase();
            if (apiBase) {
                updateStatus(true, `已连接到 ${apiBase}`);
            } else {
                updateStatus(false, '请先启动 run_stage5_api_server.py');
            }
            loadPerformance();
        })();
    </script>
</body>
</html>
